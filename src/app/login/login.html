<div class="login-page">
    <div class="login-container">
        <!-- Logo Section -->
        <div class="login-header">
            <img src="upscalemedia-transformed (3).png" alt="AutoTrack" class="login-logo" />
            <h1 class="login-title">Welcome Back</h1>
            <p class="login-subtitle">Sign in to manage your inventory</p>
        </div>

        <!-- Login Form -->
        <form class="login-form" (ngSubmit)="onLogin()">
            <!-- Error Message -->
            <div class="error-message" *ngIf="errorMessage">
                <span class="error-icon">⚠️</span>
                {{ errorMessage }}
            </div>

            <!-- Username Field -->
            <div class="form-group">
                <label for="username" class="form-label">Username</label>
                <input type="text" id="username" class="form-input" placeholder="Enter your username"
                    [(ngModel)]="username" name="username" [disabled]="isLoading" />
            </div>

            <!-- Password Field -->
            <div class="form-group">
                <label for="password" class="form-label">Password</label>
                <input type="password" id="password" class="form-input" placeholder="Enter your password"
                    [(ngModel)]="password" name="password" [disabled]="isLoading" />
            </div>

            <!-- Submit Button -->
            <button type="submit" class="login-btn" [disabled]="isLoading">
                <span *ngIf="!isLoading">Sign In</span>
                <span *ngIf="isLoading">Signing in...</span>
            </button>
        </form>

        <!-- Demo Credentials -->
        <div class="demo-credentials">
            <p class="demo-title">Demo Credentials:</p>
            <p class="demo-text">Username: <strong>admin</strong> | Password: <strong>admin123</strong></p>
            <p class="demo-text">Username: <strong>employee</strong> | Password: <strong>employee123</strong></p>
        </div>
    </div>
</div>
